version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zain_traders_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: zain_traders_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zain_traders_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  zain_traders_network:
    driver: bridge

volumes:
  postgres_data:
